---
name: Deploy documentation website to GitHub Pages

'on':
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build static website
        run: npm run build
        working-directory: website

      - name: Verify static website assets
        shell: bash
        run: |
          grep -Fq 'Understand distributed applications through messaging' \
            website/out/docs/runtime-monitoring/index.html
          grep -Fq 'Applications first, infrastructure when needed' \
            website/out/docs/runtime-monitoring/index.html
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          test -n "$version"
          grep -Fq "$version" \
            website/out/docs/runtime-monitoring/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/out

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
