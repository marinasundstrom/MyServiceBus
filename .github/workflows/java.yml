---
name: Java CI

'on':
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.0.0'
      - name: Verify release versions
        run: ./eng/verify-release-versions.sh
      - name: Build with Gradle
        run: gradle test publish
      - name: Start Amazon SQS/SNS emulator
        run: docker compose -f test/AmazonSqsLocalStack/compose.yaml up -d --wait
      - name: Test Amazon SQS/SNS transport
        env:
          RUN_AMAZON_SQS_LOCALSTACK_TESTS: '1'
        run: gradle :myservicebus-amazon-sqs:test --rerun-tasks
      - name: Stop Amazon SQS/SNS emulator
        if: always()
        run: docker compose -f test/AmazonSqsLocalStack/compose.yaml down
      - name: Verify generated dispatch with GraalVM Native Image
        run: ./eng/verify-java-aot.sh
      - name: Verify Maven packages
        run: ./eng/verify-maven-packages.sh
      - name: Verify Maven package consumer
        run: ./eng/verify-maven-package-consumer.sh
