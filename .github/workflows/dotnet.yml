---
name: .NET CI

'on':
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Restore dependencies
        run: dotnet restore --warnaserror:'NU1901;NU1902;NU1903;NU1904'
      - name: Verify supported versions
        run: ./eng/verify-supported-versions.sh
      - name: Verify release versions
        run: ./eng/verify-release-versions.sh
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Start Amazon SQS/SNS emulator
        run: docker compose -f test/AmazonSqsLocalStack/compose.yaml up -d --wait
      - name: Test Amazon SQS/SNS transport
        env:
          RUN_AMAZON_SQS_LOCALSTACK_TESTS: '1'
        run: dotnet test test/MyServiceBus.AmazonSqs.Tests/MyServiceBus.AmazonSqs.Tests.csproj --no-build --configuration Release
      - name: Stop Amazon SQS/SNS emulator
        if: always()
        run: docker compose -f test/AmazonSqsLocalStack/compose.yaml down
      - name: Verify .NET NativeAOT application
        run: ./eng/verify-dotnet-aot.sh
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.7.26381.103'
      - name: Build NuGet packages
        run: ./eng/pack-dotnet-packages.sh
      - name: Verify NuGet packages
        run: ./eng/verify-dotnet-packages.sh
      - name: Verify NuGet package consumer
        run: ./eng/verify-dotnet-package-consumer.sh
      - name: Verify .NET 11 union package consumers
        run: ./eng/verify-dotnet11-union-package-consumers.sh
      - name: Verify .NET 11 generated union and Runtime Async NativeAOT application
        run: ./eng/verify-dotnet11-runtime-async-aot.sh
