---
name: Publish Maven Central preview

'on':
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Existing Maven Central deployment ID to resume acceptance checks without uploading again
        required: false
        type: string

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.0.0'

      - name: Read and verify release version
        id: release-version
        shell: bash
        run: |
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          case "$version" in
            *-preview.*) ;;
            *)
              echo "Expected a preview version, but found '$version'." >&2
              exit 1
              ;;
          esac
          ./eng/verify-release-versions.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify publication secrets
        shell: bash
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          test -n "$OSSRH_USERNAME"
          test -n "$OSSRH_TOKEN"
          test -n "$MAVEN_SIGNING_KEY"
          test -n "$MAVEN_SIGNING_PASSWORD"

      - name: Test
        if: inputs.deployment_id == ''
        run: gradle test

      - name: Stage signed Maven publications
        if: inputs.deployment_id == ''
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: gradle publish

      - name: Verify Maven publications
        if: inputs.deployment_id == ''
        env:
          REQUIRE_MAVEN_SIGNATURES: '1'
        run: ./eng/verify-maven-packages.sh "${{ steps.release-version.outputs.version }}"

      - name: Verify Maven package consumer
        if: inputs.deployment_id == ''
        run: ./eng/verify-maven-package-consumer.sh

      - name: Create Maven Central bundle
        if: inputs.deployment_id == ''
        run: ./eng/create-maven-central-bundle.sh build/maven-central-bundle.zip "${{ steps.release-version.outputs.version }}"

      - name: Upload release bundle artifact
        if: inputs.deployment_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-${{ steps.release-version.outputs.version }}
          path: build/maven-central-bundle.zip
          if-no-files-found: error

      - name: Upload to Maven Central
        id: central-upload
        if: inputs.deployment_id == ''
        shell: bash
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          authorization="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$authorization"
          deployment_id="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            --form 'bundle=@build/maven-central-bundle.zip;type=application/octet-stream' \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=MyServiceBus-$RELEASE_VERSION")"
          if ! [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Maven Central returned an unexpected deployment ID: $deployment_id" >&2
            exit 1
          fi
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Maven Central acceptance
        shell: bash
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id || steps.central-upload.outputs.deployment-id }}
        run: |
          test -n "$DEPLOYMENT_ID"
          authorization="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$authorization"
          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            state="$(jq --raw-output '.deploymentState' <<< "$response")"
            echo "Maven Central deployment state: $state"
            case "$state" in
              PUBLISHING|PUBLISHED)
                echo "Maven Central accepted the deployment; publication may continue asynchronously."
                exit 0
                ;;
              FAILED)
                jq '.errors' <<< "$response"
                exit 1
                ;;
              PENDING|VALIDATING|VALIDATED)
                sleep 15
                ;;
              *)
                echo "Unexpected Maven Central deployment state: $state" >&2
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for Maven Central to accept deployment $DEPLOYMENT_ID." >&2
          exit 1
