plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

group = 'com.myservicebus.kotlin.ktor.sample'

dependencies {
    implementation project(':myservicebus-kotlin')
    implementation project(':myservicebus-rabbitmq')
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:${jacksonVersion}"
    implementation "io.ktor:ktor-server-core-jvm:${ktorVersion}"
    implementation "io.ktor:ktor-server-netty-jvm:${ktorVersion}"
    implementation "io.ktor:ktor-server-content-negotiation-jvm:${ktorVersion}"
    implementation "io.ktor:ktor-serialization-jackson-jvm:${ktorVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation "io.ktor:ktor-server-test-host-jvm:${ktorVersion}"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.2.20"
    testImplementation "org.testcontainers:testcontainers-rabbitmq:${testcontainersVersion}"
}

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.myservicebus.sample.ktor.ApplicationKt'
}
